name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Preserve queued release decisions instead of replacing a pending main run.
concurrency:
  group: clients-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      docker: ${{ steps.plan.outputs.docker }}
      mobile: ${{ steps.plan.outputs.mobile }}
      desktop: ${{ steps.desktop.outputs.changed }}
      dependency-hash: ${{ steps.plan.outputs.dependency-hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        with:
          node-version: 24
          cache: yarn
      - name: Restore installed dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.yarnrc', '.npmrc') }}
      - run: yarn install --frozen-lockfile --ignore-scripts
        if: steps.dependencies.outputs.cache-hit != 'true'
      - name: Validate explicit release decision
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          node scripts/release-plan.cjs "$BASE" "$HEAD"
          echo "dependency-hash=${{ hashFiles('yarn.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.yarnrc', '.npmrc') }}" >> "$GITHUB_OUTPUT"
          echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
          echo "TURBO_SCM_HEAD=$HEAD" >> "$GITHUB_ENV"
      - run: yarn test:releases
      - name: Detect desktop or workspace changes
        id: desktop
        run: |
          if git diff --quiet "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" -- apps/desktop packages package.json yarn.lock turbo.json .npmrc .yarnrc .github/workflows/ci.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Check affected packages and consumers
        env:
          CI_FILTERS: ${{ steps.plan.outputs.filters }}
        run: node -e 'require("node:child_process").execFileSync("yarn", ["turbo", "run", "lint", "type-check", "test", "build", ...JSON.parse(process.env.CI_FILTERS)], {stdio:"inherit"})'

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: checks
    if: needs.checks.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        with:
          node-version: 24
          cache: yarn
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ needs.checks.outputs.dependency-hash }}
      - run: yarn install --frozen-lockfile --ignore-scripts
        if: steps.dependencies.outputs.cache-hit != 'true'
      - run: yarn build -F desktop
      - run: yarn workspace desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamenode-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          if-no-files-found: error

  prepare:
    name: Reserve immutable release
    needs: checks
    if: github.event_name == 'push' && needs.checks.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        with:
          node-version: 24
          cache: yarn
      - name: Restore installed dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.yarnrc', '.npmrc') }}
      - run: yarn install --frozen-lockfile --ignore-scripts
        if: steps.dependencies.outputs.cache-hit != 'true'
      - name: Require configuration for every selected target
        env:
          RELEASE_APPS: ${{ needs.checks.outputs.apps }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEB_APP_UUID: ${{ vars.COOLIFY_WEB_APP_UUID }}
          COOLIFY_ADMIN_APP_UUID: ${{ vars.COOLIFY_ADMIN_APP_UUID }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEYSTORE_KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASS: ${{ secrets.RELEASE_KEYSTORE_KEY_PASS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LIVE_UPDATE_PUBLIC_URL: ${{ secrets.LIVE_UPDATE_PUBLIC_URL }}
        run: node scripts/release-plan.cjs --check-env
      - name: Version selected apps and reserve retryable snapshot
        id: release
        env:
          BASE: ${{ github.event.before }}
        run: node scripts/prepare-release.cjs "$BASE" --publish

  docker:
    name: Docker delivery
    needs: [checks, prepare]
    if: needs.checks.outputs.docker != '[]'
    uses: ./.github/workflows/release-docker.yml
    with:
      apps: ${{ needs.checks.outputs.docker }}
      ref: ${{ needs.prepare.outputs.ref }}
    secrets: inherit

  mobile:
    name: Android delivery
    needs: [checks, prepare]
    if: needs.checks.outputs.mobile == 'true'
    uses: ./.github/workflows/release-mobile.yml
    with:
      dependency-hash: ${{ needs.checks.outputs.dependency-hash }}
      ref: ${{ needs.prepare.outputs.ref }}
    secrets: inherit
