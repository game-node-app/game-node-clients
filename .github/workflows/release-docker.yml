name: Release Docker apps

on:
  workflow_call:
    inputs:
      apps:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deliver:
    name: Release ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
    env:
      RELEASE_APP: ${{ matrix.app }}
      IMAGE: lamarcke/game-node-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refuse stale or unselected releases
        run: |
          node scripts/prepare-release.cjs --assert-current "$RELEASE_APP"
          node -e 'const r = require("./.release.json"); if (!r.docker.includes(process.env.RELEASE_APP)) throw Error("App not selected"); console.log(`SOURCE=${r.source}\nVERSION=${r.versions[process.env.RELEASE_APP]}`)' >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Reuse an already published source image on retry
        id: image
        run: |
          if docker buildx imagetools inspect "$IMAGE:$SOURCE" > /dev/null 2>&1; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE:$SOURCE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.exists != 'true'
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SOURCE }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ env.SOURCE }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Deploy exact image and verify Coolify completion
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEB_APP_UUID: ${{ vars.COOLIFY_WEB_APP_UUID }}
          COOLIFY_ADMIN_APP_UUID: ${{ vars.COOLIFY_ADMIN_APP_UUID }}
        run: node scripts/deploy-coolify.cjs
